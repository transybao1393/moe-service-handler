<text class="s" x="20" y="34">Each node runs its own layers and passes the result on; the last one samples the token.</text>
<text class="s" x="20" y="52">Three requests in the ring at once, so every node stays busy:</text>
<circle cx="392" cy="48" r="6" fill="#3b82f6"/><text class="s" x="402" y="52">request 1</text>
<circle cx="472" cy="48" r="6" fill="#10b981"/><text class="s" x="482" y="52">request 2</text>
<circle cx="552" cy="48" r="6" fill="#f59e0b"/><text class="s" x="562" y="52">request 3</text>
