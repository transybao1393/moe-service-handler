<path class="wire" d="M180,168 L124,168" marker-end="url(#a)"/><text class="m" x="150" y="184" text-anchor="middle">stream</text>
<path class="wire" d="M370,118 L436,118" marker-end="url(#a)"/><text class="m" x="405" y="108" text-anchor="middle">Hidden</text><text class="m" x="405" y="136" text-anchor="middle">f32</text>
