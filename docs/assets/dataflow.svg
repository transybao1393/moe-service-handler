<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 300" width="920" role="img" aria-labelledby="t d">
<title id="t">moe-service-handler data flow</title>
<desc id="d">A client sends a request to the M4 coordinator. Hidden states flow through the layer ranges on the M4, the M1 and a second M4; the last node samples a token and sends it back to the coordinator, which streams it to the client. Three requests are in the ring at once.</desc>
<style>
  .bg { fill: #ffffff; }
  .node { fill: #f8fafc; stroke: #94a3b8; stroke-width: 1.5; }
  .client { fill: #f1f5f9; stroke: #94a3b8; stroke-width: 1.5; }
  .wire { fill: none; stroke: #94a3b8; stroke-width: 2; }
  .h { font: 600 14px ui-sans-serif, -apple-system, "Segoe UI", sans-serif; fill: #0f172a; }
  .s { font: 12px ui-sans-serif, -apple-system, "Segoe UI", sans-serif; fill: #475569; }
  .m { font: 11px ui-monospace, "SF Mono", Menlo, monospace; fill: #64748b; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #0d1117; }
    .node { fill: #161b22; stroke: #484f58; }
    .client { fill: #1c2128; stroke: #484f58; }
    .wire { stroke: #484f58; }
    .h { fill: #e6edf3; }
    .s { fill: #9da7b3; }
    .m { fill: #8b949e; }
  }
</style>
