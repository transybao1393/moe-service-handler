<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="900" role="img" aria-labelledby="t d">
<title id="t">moe-service-handler data flow</title>
<desc id="d">A client sends a prompt to the m4 controller. The controller runs the first layers and sends hidden states to the m1 worker; m1 runs its layers and sends the result back to the controller, which sends it to the m4b worker; m4b runs the last layers and the head, and sends the sampled token back to the controller, which streams it to the client. The workers never talk to each other. Three requests are in the cluster at once.</desc>
<style>
  .bg { fill: #ffffff; }
  .node { fill: #f8fafc; stroke: #94a3b8; stroke-width: 1.5; }
  .ctl { fill: #eff6ff; stroke: #64748b; stroke-width: 1.5; }
  .client { fill: #f1f5f9; stroke: #94a3b8; stroke-width: 1.5; }
  .wire { fill: none; stroke: #94a3b8; stroke-width: 2; }
  .back { fill: none; stroke: #94a3b8; stroke-width: 2; stroke-dasharray: 6 4; }
  .h { font: 600 14px ui-sans-serif, -apple-system, "Segoe UI", sans-serif; fill: #0f172a; }
  .s { font: 12px ui-sans-serif, -apple-system, "Segoe UI", sans-serif; fill: #475569; }
  .m { font: 11px ui-monospace, "SF Mono", Menlo, monospace; fill: #64748b; }
  .arrow { fill: #94a3b8; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #0d1117; }
    .node { fill: #161b22; stroke: #484f58; }
    .ctl { fill: #172033; stroke: #6e7681; }
    .client { fill: #1c2128; stroke: #484f58; }
    .wire, .back { stroke: #6e7681; }
    .arrow { fill: #6e7681; }
    .h { fill: #e6edf3; }
    .s { fill: #9da7b3; }
    .m { fill: #8b949e; }
  }
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="arrow" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="900" height="500" rx="12"/>
<text class="s" x="20" y="32">The controller sends each step to a worker, gets the result back, and sends it to the next worker; each node runs its own layers.</text>
<text class="s" x="20" y="52">Three requests in the cluster at once, so every node stays busy:</text>
<circle cx="392" cy="48" r="6" fill="#3b82f6"/><text class="s" x="402" y="52">request 1</text>
