# The real engine on one machine: OLMoE-1B-7B split 8 / 4 / 4 over loopback, in the shape of
# the M4 + M1 + M4 cluster. Build with --features olmoe.
hidden_dim = 2048
num_layers = 16

[engine]
kind = "streammoe"
model_dir = "~/models/olmoe-1b-7b"
n_ctx = 2048
mem_cap_gib = 3.0

[http]
listen = "127.0.0.1:8080"
tokenizer = "~/models/olmoe-1b-7b/hf/tokenizer.json"
chat_template = "olmoe"
model = "olmoe-1b-7b"

[[nodes]]
name = "m4"
addr = "127.0.0.1:7201"
layers = [0, 8]

[[nodes]]
name = "m1"
addr = "127.0.0.1:7202"
layers = [8, 12]

[[nodes]]
name = "m4b"
addr = "127.0.0.1:7203"
layers = [12, 16]
