# The real engine on one node: OLMoE-1B-7B (16 layers), the reference for olmoe-3node.toml. Build with --features olmoe.
hidden_dim = 2048
num_layers = 16

[engine]
kind = "streammoe"
model_dir = "~/models/olmoe-1b-7b"
n_ctx = 2048
# 3 request slots (max_in_flight) × 0.5 GiB of KV at n_ctx 2048, plus weights and hot tier.
mem_cap_gib = 4.0

[http]
listen = "127.0.0.1:8080"
tokenizer = "~/models/olmoe-1b-7b/hf/tokenizer.json"
chat_template = "olmoe"
model = "olmoe-1b-7b"

[[nodes]]
name = "m4"
addr = "127.0.0.1:7201"
layers = [0, 16]
