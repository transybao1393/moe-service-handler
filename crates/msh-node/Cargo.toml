[package]
name = "msh-node"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
# The real engine. Pick exactly one model feature: streammoe compiles shapes in per model.
streammoe = ["dep:streammoe"]
olmoe = ["streammoe", "streammoe/model-olmoe-1b-7b"]
qwen36 = ["streammoe", "streammoe/model-qwen3-6-35b-a3b"]

[dependencies]
# streammoe is published as the `moeflux` crate. Pinned to a commit of the local checkout (its
# main is not pushed yet); switch the URL to https://github.com/transybao1393/moeflux.git once
# that commit is on GitHub.
streammoe = { package = "moeflux", git = "file:///Users/johnathan/Documents/projects/moeflux", rev = "748bb3e8b83c59ce79ca98b1512958e023670fc8", optional = true }
msh-net = { version = "0.1.0", path = "../msh-net" }
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.0.7"
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros", "net", "sync"] }
axum = "0.8.9"
tokio-stream = "0.1.19"
serde_json = "1.0.154"
tokenizers = { version = "0.23.2", default-features = false, features = ["onig"] }

[dev-dependencies]
http-body-util = "0.1.5"
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros", "time"] }
tower = { version = "0.5.3", features = ["util"] }
